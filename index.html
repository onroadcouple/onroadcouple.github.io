<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta property="og:title" content="On Road Couple - Travel | Trek | Ride" />
    <meta
      property="og:description"
      content="On Road Couple – Travel | Trek | Ride – by Harshada & Sujeet. Watch our vlogs and explore travel experiences."
    />
    <meta property="og:image" content="/OnRoadCoupleThumb.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>On Road Couple</title>
    <meta
      name="description"
      content="On Road Couple – Travel | Trek | Ride – by Harshada & Sujeet. Watch our vlogs and explore travel experiences."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- Cover / Profile -->
    <div class="cover"></div>
    <div class="profile-section">
      <div class="profile-pic"></div>
      <div class="profile-info">
        <h1>On Road Couple</h1>
        <p>Harshada &amp; Sujeet — Travel | Trek | Ride</p>
      </div>
      <div class="social-buttons">
        <a
          href="mailto:brand.onroadcouple@gmail.com"
          class="email"
          title="Email"
          ><i class="bi bi-envelope-fill"></i
        ></a>
        <a
          href="https://youtube.com/@onroadcouple"
          class="youtube"
          target="_blank"
          title="YouTube"
          ><i class="bi bi-youtube"></i
        ></a>
        <a
          href="https://instagram.com/onroadcouple"
          class="instagram"
          target="_blank"
          title="Instagram"
          ><i class="bi bi-instagram"></i
        ></a>
        <a
          href="https://facebook.com/onroadcouple"
          class="facebook"
          target="_blank"
          title="Facebook"
          ><i class="bi bi-facebook"></i
        ></a>
      </div>
    </div>

    <!-- ===== ITINERARIES SECTION ===== -->
    <section class="itineraries-section">
      <h2>🗺️ Travel Itineraries</h2>
      <div class="itineraries-list">

        <a class="itinerary-row" href="https://imojo.in/singaporeTravelGuide" target="_blank">
          <img class="itinerary-thumb" src="/singapore.png" alt="Singapore">
          <span class="itinerary-title">Singapore Complete Itinerary</span>
          <span class="itinerary-chevron">›</span>
        </a>

        <a class="itinerary-row" href="/itineraries/hampi-itinerary.pdf" target="_blank">
          <img class="itinerary-thumb" src="/hampi.png" alt="Hampi">
          <span class="itinerary-title">Hampi Complete Itinerary</span>
          <span class="itinerary-chevron">›</span>
        </a>

       

      </div>

      <!-- Amazon Store CTA -->
      <div class="amazon-store-cta-wrap">
        <a href="./amazon-store/" class="amazon-cta-btn">
          <span class="amazon-cta-btn__icon">🛍️</span>
          Explore Our Amazon Travel Store
          <span class="amazon-cta-btn__arrow">→</span>
        </a>
      </div>
    </section>

    <!-- Latest Vlogs Section -->
    <section>
      <h2>🎥 Latest Vlogs</h2>
      <div class="content-grid" id="vlogsGrid">
        <!-- Skeleton placeholders while loading -->
        <div class="content-card skeleton-card"><div class="card-img-container skeleton-img"></div><div class="card-content"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
        <div class="content-card skeleton-card"><div class="card-img-container skeleton-img"></div><div class="card-content"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
        <div class="content-card skeleton-card"><div class="card-img-container skeleton-img"></div><div class="card-content"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      </div>
    </section>
  </body>
</html>
