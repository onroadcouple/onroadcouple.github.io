<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Admin - Two Tickets to Freedom</title>
    <!-- Use the same fonts as the main site -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Use bootstrap icons for icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Dropify/0.2.2/css/dropify.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
    <style>
      /* Dropify internal overrides to match Admin styling */
      .dropify-wrapper { border-radius: 8px; font-family: 'Inter', sans-serif; }
      
      /* Cropper Modal Styles */
      .crop-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .crop-modal.active { display: flex; }
      .crop-container {
        background: var(--bg-card, #fff);
        padding: 20px;
        border-radius: 12px;
        max-width: 600px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .img-container {
        width: 100%;
        max-height: 400px;
        background: #eee;
      }
      .img-container img {
        max-width: 100%;
        display: block;
      }
      .crop-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      #cancelCropBtn {
        background-color: #ef4444;
        color: white;
        border: 1px solid #ef4444;
        transition: background-color 0.2s;
      }
      #cancelCropBtn:hover {
        background-color: #dc2626;
      }
      
      /* Progress Bar Styles */
      .progress-container {
        display: none;
        width: 100%;
        background: #f3f4f6;
        border-radius: 8px;
        height: 12px;
        margin: 15px 0;
        overflow: hidden;
        position: relative;
      }
      .progress-bar {
        height: 100%;
        background: var(--primary, #f59e0b);
        width: 0%;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 12px;
        font-weight: 600;
        color: #4b5563;
        margin-bottom: 5px;
        display: block;
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Dropify/0.2.2/js/dropify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  </head>
  <body>
    <!-- Top Header -->
    <header class="admin-header">
        <a href="../amazon-store/" class="back-link">
          <i class="bi bi-arrow-left"></i> Back to Store
        </a>
        <div class="logo">
          <span>Admin</span> Dashboard
        </div>
      </div>
    </header>

    <main class="admin-container">
      
      <!-- View 1: Login Block (shown if no PAT in localStorage) -->
      <div id="loginView" class="view-panel active">
        <h2><i class="bi bi-shield-lock"></i> Authentication Required</h2>
        <p>This admin dashboard is secured by Firebase. Enter your email and password to manage products.</p>
        
        <form id="loginForm">
          <div class="form-group">
            <label for="adminEmail">Email Address</label>
            <input type="email" id="adminEmail" placeholder="admin@example.com" required />
          </div>
          <div class="form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">Authenticate</button>
        </form>
      </div>

      <!-- View 2: Add Product Form -->
      <div id="dashboardView" class="view-panel">
        <div class="panel-header">
          <h2 id="formTitle"><i class="bi bi-box-seam"></i> Add New Product</h2>
          <button id="logoutBtn" class="btn btn-secondary btn-sm">Sign Out</button>
        </div>
        
        <form id="productForm">
          <input type="hidden" id="editingProductId" value="" />
          <div class="form-row">
            <div class="form-group flex-2">
              <label for="pTitle">Product Title</label>
              <input type="text" id="pTitle" placeholder="e.g., DJI Mini 4 Pro Drone" required />
            </div>
            <div class="form-group flex-1">
              <label for="pCategory">Category</label>
              <select id="pCategorySelect" class="form-control" required>
                <option value="" disabled selected>Select Category...</option>
                <!-- Existing categories populated by JS -->
                <option value="new">+ Add New Category</option>
              </select>
              <input type="text" id="pNewCategory" placeholder="Enter New Category Name" style="display: none; margin-top: 8px;" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="pLink">Amazon Affiliate Link</label>
              <input type="url" id="pLink" placeholder="https://www.amazon.in/dp/B0CHJFVPDZ?tag=your-tag-21" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="pImageFile">Product Image <small>(Square Aspect Recommended)</small></label>
              <input type="file" id="pImageFile" class="dropify" data-max-file-size="5M" accept="image/*" />
              <!-- Hidden field to keep track of previous image url when editing -->
              <input type="hidden" id="pImageUrl" value="" />
            </div>
          </div>

          <!-- Progress Bar Area -->
          <div id="uploadProgressContainer" style="display: none; margin-bottom: 15px;">
            <span class="progress-text">Uploading: <span id="uploadPercent">0</span>%</span>
            <div class="progress-container" style="display: block;">
              <div id="uploadProgressBar" class="progress-bar"></div>
            </div>
          </div>

          <!-- Status / Action Area -->
          <div class="action-bar">
            <div id="statusMessage" class="status-msg"></div>
            <div class="form-actions">
              <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display: none;">Cancel Edit</button>
              <button type="submit" id="submitBtn" class="btn btn-primary">
                <i class="bi bi-cloud-arrow-up"></i> Save to Database
              </button>
            </div>
          </div>
        </form>

        <hr class="divider" />
        
        <div class="manage-section">
          <h2><i class="bi bi-list-ul"></i> Manage Products</h2>
          <div class="table-container">
            <table class="table" id="productsTable">
              <thead>
                <tr>
                  <th>Product Title</th>
                  <th>Category</th>
                  <th class="actions-col">Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <!-- Populated by JS -->
                <tr><td colspan="4" class="text-center">Loading products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>

    <!-- Cropper Modal -->
    <div id="cropModal" class="crop-modal">
      <div class="crop-container">
        <h3 style="margin:0; font-size:18px;"><i class="bi bi-crop"></i> Crop Image (Square)</h3>
        <div class="img-container">
          <img id="imageToCrop" src="" alt="Image to crop">
        </div>
        <div class="crop-actions">
          <button type="button" id="cancelCropBtn" class="btn btn-secondary">Cancel</button>
          <button type="button" id="confirmCropBtn" class="btn btn-primary">Crop & Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
